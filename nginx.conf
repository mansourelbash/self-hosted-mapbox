server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  location /speech/ {
    proxy_pass http://tts:5001/;
    proxy_read_timeout 60s;
    client_max_body_size 8k;
  }
  location /routing/ {
    proxy_pass http://osrm:5000/;
    proxy_read_timeout 30s;
  }
  location / { try_files $uri $uri/ /index.html; }
}
